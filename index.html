<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST300R 360° ビューア</title>
<style>
  :root{
    --bg1:#f4f5f7; --bg2:#dfe3e8; --fg:#333; --sub:#888;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:radial-gradient(ellipse at 50% 40%, var(--bg1) 0%, var(--bg2) 100%);
    color:var(--fg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #stage{
    position:relative;
    width:min(92vw, calc(92vh * 16 / 9));
    aspect-ratio:16/9;
    cursor:grab; touch-action:none; overflow:hidden;
  }
  #stage.dragging{cursor:grabbing;}
  #zoomWrap{
    position:absolute; inset:0;
    transform-origin:0 0; will-change:transform;
    pointer-events:none;
  }
  #zoomWrap img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; pointer-events:none;
    opacity:0;
  }
  #zoomWrap img.visible{opacity:1;}
  /* 読み込み表示 */
  #loader{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
  }
  #loader .bar{
    width:min(60%, 320px); height:4px; border-radius:2px;
    background:rgba(0,0,0,.12); overflow:hidden;
  }
  #loader .bar i{
    display:block; height:100%; width:0%;
    background:#555; border-radius:2px; transition:width .15s;
  }
  #loader span{font-size:13px; color:var(--sub); letter-spacing:.05em;}
  /* 操作ヒント・コントロール */
  #ui{
    display:flex; align-items:center; gap:16px; margin-top:10px;
    opacity:0; transition:opacity .5s;
  }
  #ui.show{opacity:1;}
  #hint{font-size:13px; color:var(--sub); letter-spacing:.05em;}
  #playBtn{
    border:1px solid rgba(0,0,0,.2); background:rgba(255,255,255,.6);
    color:var(--fg); font-size:13px; padding:6px 14px; border-radius:20px;
    cursor:pointer; letter-spacing:.05em;
  }
  #playBtn:hover{background:rgba(255,255,255,.9);}
  .zoomBtn{
    border:1px solid rgba(0,0,0,.2); background:rgba(255,255,255,.6);
    color:var(--fg); font-size:14px; width:32px; height:32px;
    border-radius:50%; cursor:pointer; line-height:1;
  }
  .zoomBtn:hover{background:rgba(255,255,255,.9);}
  #resetBtn{width:auto; border-radius:20px; padding:0 14px; font-size:12px;}
</style>
</head>
<body>
  <div id="stage">
    <div id="zoomWrap"></div>
    <div id="loader">
      <div class="bar"><i id="barFill"></i></div>
      <span id="loadText">読み込み中… 0%</span>
    </div>
  </div>
  <div id="ui">
    <span id="hint">← ドラッグで回転 / ホイール・ピンチで拡大縮小 →</span>
    <button id="playBtn" type="button">▶ 自動回転を開始</button>
    <button class="zoomBtn" id="zoomOutBtn" type="button" aria-label="縮小">−</button>
    <button class="zoomBtn" id="zoomInBtn" type="button" aria-label="拡大">＋</button>
    <button class="zoomBtn" id="resetBtn" type="button">等倍に戻す</button>
  </div>

<script>
(function(){
  var FRAME_COUNT = 36;
  var PATH = function(i){ return 'images/frame_' + String(i).padStart(2,'0') + '.webp'; };
  var DRAG_PER_FRAME = 12;      // 1フレーム進むのに必要なドラッグ量(px)
  var AUTO_INTERVAL = 90;       // 自動回転の1フレームあたりms
  var RESUME_DELAY = 2500;      // 操作後に自動回転を再開するまでのms

  var MIN_ZOOM = 1, MAX_ZOOM = 4;

  var stage = document.getElementById('stage');
  var zoomWrap = document.getElementById('zoomWrap');
  var loader = document.getElementById('loader');
  var barFill = document.getElementById('barFill');
  var loadText = document.getElementById('loadText');
  var ui = document.getElementById('ui');
  var playBtn = document.getElementById('playBtn');

  var frames = [];
  var current = 0;
  var loaded = 0;
  var autoOn = false;       // ユーザー設定としての自動回転ON/OFF(初期状態は停止)
  var autoTimer = null;
  var resumeTimer = null;

  // ---- プリロード ----
  for (var i = 0; i < FRAME_COUNT; i++) {
    (function(i){
      var img = new Image();
      img.onload = img.onerror = function(){
        loaded++;
        var pct = Math.round(loaded / FRAME_COUNT * 100);
        barFill.style.width = pct + '%';
        loadText.textContent = '読み込み中… ' + pct + '%';
        if (loaded === FRAME_COUNT) start();
      };
      img.src = PATH(i);
      zoomWrap.appendChild(img);
      frames[i] = img;
    })(i);
  }

  function show(idx){
    idx = ((idx % FRAME_COUNT) + FRAME_COUNT) % FRAME_COUNT;
    if (idx === current && frames[current].classList.contains('visible')) return;
    frames[current].classList.remove('visible');
    current = idx;
    frames[current].classList.add('visible');
  }

  function start(){
    loader.style.display = 'none';
    ui.classList.add('show');
    frames[0].classList.add('visible');
  }

  // ---- 自動回転 ----
  function startAuto(){
    if (!autoOn || autoTimer) return;
    autoTimer = setInterval(function(){ show(current + 1); }, AUTO_INTERVAL);
  }
  function stopAuto(){
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    if (resumeTimer) { clearTimeout(resumeTimer); resumeTimer = null; }
  }
  function scheduleResume(){
    if (!autoOn) return;
    if (resumeTimer) clearTimeout(resumeTimer);
    resumeTimer = setTimeout(startAuto, RESUME_DELAY);
  }

  playBtn.addEventListener('click', function(){
    autoOn = !autoOn;
    if (autoOn) {
      playBtn.textContent = '⏸ 自動回転を停止';
      startAuto();
    } else {
      playBtn.textContent = '▶ 自動回転を開始';
      stopAuto();
    }
  });

  // ---- ズーム(ホイール / ピンチ / ボタン) ----
  var zoom = 1, tx = 0, ty = 0;

  function applyZoom(){
    // 画像がステージの外へ出過ぎないように移動量を制限
    var r = stage.getBoundingClientRect();
    var minX = r.width  - r.width  * zoom;
    var minY = r.height - r.height * zoom;
    tx = Math.min(0, Math.max(minX, tx));
    ty = Math.min(0, Math.max(minY, ty));
    zoomWrap.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + zoom + ')';
  }
  function zoomAt(px, py, newZoom){
    // ステージ内の点(px,py)を中心に拡大縮小
    newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZoom));
    var cx = (px - tx) / zoom;
    var cy = (py - ty) / zoom;
    zoom = newZoom;
    tx = px - cx * zoom;
    ty = py - cy * zoom;
    applyZoom();
  }
  function resetZoom(){
    zoom = 1; tx = 0; ty = 0; applyZoom();
  }

  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    var factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    zoomAt(e.clientX - r.left, e.clientY - r.top, zoom * factor);
  }, {passive:false});

  document.getElementById('zoomInBtn').addEventListener('click', function(){
    var r = stage.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, zoom * 1.3);
  });
  document.getElementById('zoomOutBtn').addEventListener('click', function(){
    var r = stage.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, zoom / 1.3);
  });
  document.getElementById('resetBtn').addEventListener('click', resetZoom);
  stage.addEventListener('dblclick', resetZoom);

  // ---- ドラッグ / スワイプ ----
  var dragging = false;
  var startX = 0;
  var startFrame = 0;

  function pointerDown(x){
    dragging = true;
    startX = x;
    startFrame = current;
    stage.classList.add('dragging');
    stopAuto();
  }
  function pointerMove(x){
    if (!dragging) return;
    var delta = x - startX;
    var frameOffset = Math.round(delta / DRAG_PER_FRAME);
    show(startFrame + frameOffset);
  }
  function pointerUp(){
    if (!dragging) return;
    dragging = false;
    stage.classList.remove('dragging');
    scheduleResume();
  }

  stage.addEventListener('mousedown', function(e){ e.preventDefault(); pointerDown(e.clientX); });
  window.addEventListener('mousemove', function(e){ pointerMove(e.clientX); });
  window.addEventListener('mouseup', pointerUp);

  // タッチ: 1本指=回転 / 2本指=ピンチで拡大縮小・移動
  var pinch = null;

  function touchInfo(e){
    var r = stage.getBoundingClientRect();
    var t0 = e.touches[0], t1 = e.touches[1];
    return {
      dist: Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY),
      midX: (t0.clientX + t1.clientX) / 2 - r.left,
      midY: (t0.clientY + t1.clientY) / 2 - r.top
    };
  }

  stage.addEventListener('touchstart', function(e){
    if (e.touches.length === 2) {
      dragging = false;
      stage.classList.remove('dragging');
      var info = touchInfo(e);
      pinch = { dist: info.dist, midX: info.midX, midY: info.midY, zoom: zoom };
      stopAuto();
    } else if (e.touches.length === 1 && !pinch) {
      pointerDown(e.touches[0].clientX);
    }
  }, {passive:true});

  stage.addEventListener('touchmove', function(e){
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      var info = touchInfo(e);
      // 中点の移動で平行移動
      tx += info.midX - pinch.midX;
      ty += info.midY - pinch.midY;
      // 指の距離の変化で拡大縮小
      zoomAt(info.midX, info.midY, pinch.zoom * (info.dist / pinch.dist));
      pinch.midX = info.midX; pinch.midY = info.midY;
    } else if (!pinch && e.touches.length === 1) {
      pointerMove(e.touches[0].clientX);
    }
  }, {passive:false});

  function touchEnd(e){
    if (pinch && e.touches.length < 2) {
      pinch = null;
      scheduleResume();
    }
    if (e.touches.length === 0) pointerUp();
  }
  stage.addEventListener('touchend', touchEnd);
  stage.addEventListener('touchcancel', touchEnd);

  // キーボード操作(矢印キー)
  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft')  { stopAuto(); show(current - 1); scheduleResume(); }
    if (e.key === 'ArrowRight') { stopAuto(); show(current + 1); scheduleResume(); }
  });
})();
</script>
</body>
</html>
